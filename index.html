    <!-- SPA redirect for GitHub Pages (pairs with public/404.html) -->
    <script>
      (function () {
        var r = new URLSearchParams(window.location.search).get('/');
        if (r) {
          history.replaceState(null, null,
            window.location.pathname.slice(0, -1) + r.replace(/~and~/g, '&') + window.location.hash);
        }
      })();
    </script>
